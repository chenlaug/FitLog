# H2 in-memory database
spring.datasource.url=jdbc:h2:mem:fitlog_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Dialect
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Let Hibernate create the schema from entities (no Flyway in tests)
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false

# JWT
jwt.secret=test-secret-key-minimum-256-bits-long-for-hs256-algorithm
jwt.expiration=3600000
